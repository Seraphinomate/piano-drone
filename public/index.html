<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano">
<meta name="theme-color" content="#080810">
<title>Piano — Chord Builder + Drone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080810;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.07);
    --accent: #6677ff;
    --accent2: #44aaff;
    --text: #dde2f5;
    --muted: rgba(255,255,255,0.3);
    --drone: #4fd1b5;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(60,70,180,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 10%, rgba(40,100,200,0.06) 0%, transparent 50%),
      #080810;
  }
  button { font: inherit; color: inherit; }

  .app {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── Header ── */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .header-title { font-size: 26px; font-weight: 300; letter-spacing: 3px; text-shadow: 0 0 40px rgba(100,120,255,0.3); }
  .header-sub { font-family: var(--mono); font-size: 8px; letter-spacing: 3px; color: #4455aa; text-transform: uppercase; white-space: nowrap; }
  @media (max-width: 480px) { .header-sub { display: none; } }
  .status {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
    padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
  }
  .status.loading { color: #aa8833; border-color: rgba(170,136,51,0.2); }
  .status.error   { color: #cc6644; border-color: rgba(200,100,60,0.2); }
  .status.ready   { color: #44bb77; border-color: rgba(68,187,119,0.2); }
  .progress-wrap { height: 2px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; margin-top: -6px; }
  .progress-bar { height: 100%; width: 30%; background: linear-gradient(90deg, var(--accent), var(--accent2)); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

  /* ── Clavier ── */
  .piano-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px 16px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .piano-wrap::-webkit-scrollbar { display: none; }
  .keyboard { position: relative; user-select: none; -webkit-user-select: none; }
  .white-key {
    position: absolute; bottom: 0; width: 36px; height: 150px;
    background: linear-gradient(180deg, #ececf8 0%, #e0e0f0 60%, #d0d0e4 100%);
    border: 1px solid #aaa; border-top: 1px solid #ccc; border-radius: 0 0 6px 6px;
    cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;
    font-family: var(--mono); font-size: 8px; color: #999;
    transition: background 0.1s, box-shadow 0.1s, transform 0.08s;
    box-shadow: 2px 4px 10px rgba(0,0,0,0.35), inset 0 -2px 4px rgba(0,0,0,0.08);
  }
  .white-key.active {
    background: linear-gradient(180deg, #8899ff 0%, #6677ee 40%, #5566dd 100%);
    border-color: #aabbff; color: rgba(255,255,255,0.85);
    box-shadow: 0 0 16px rgba(100,130,255,0.55), inset 0 -2px 6px rgba(50,70,200,0.3);
    transform: scaleY(0.97);
  }
  .black-key {
    position: absolute; top: 0; width: 22px; height: 96px;
    background: linear-gradient(180deg, #222230 0%, #0e0e18 100%);
    border: 1px solid #444; border-radius: 0 0 4px 4px; cursor: pointer; z-index: 2;
    box-shadow: 2px 5px 12px rgba(0,0,0,0.8), inset 0 -2px 3px rgba(255,255,255,0.04);
    transition: background 0.1s, box-shadow 0.1s, transform 0.08s;
  }
  .black-key.active {
    background: linear-gradient(180deg, #8899ff 0%, #5566ee 100%);
    border-color: #aabbff;
    box-shadow: 0 0 14px rgba(100,130,255,0.65), 2px 4px 10px rgba(0,0,0,0.5);
    transform: scaleY(0.97);
  }
  body.listen-mode .white-key:not(.active), body.listen-mode .black-key:not(.active) { opacity: 0.28; cursor: default; filter: saturate(0.3); }
  .white-key.solo { background: linear-gradient(180deg, #ffdd99 0%, #ffbb44 40%, #ee9922 100%) !important; border-color: #ffcc88 !important; box-shadow: 0 0 26px rgba(255,190,80,0.8) !important; }
  .black-key.solo { background: linear-gradient(180deg, #ffdd99 0%, #ee9922 100%) !important; border-color: #ffcc88 !important; box-shadow: 0 0 22px rgba(255,190,80,0.85) !important; }
  .white-key.drone-pc::before, .black-key.drone-pc::before {
    content: ''; position: absolute; left: 50%; width: 7px; height: 7px; margin-left: -3.5px;
    border-radius: 50%; background: var(--drone); box-shadow: 0 0 8px rgba(79,209,181,0.8);
  }
  .white-key.drone-pc::before { bottom: 24px; }
  .black-key.drone-pc::before { bottom: 8px; }

  /* ── Mini-carte ── */
  .nav-row { display: flex; align-items: center; gap: 8px; margin-top: -4px; }
  .nav-btn {
    flex: none; width: 44px; height: 36px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.13); background: transparent;
    color: rgba(255,255,255,0.55); font-size: 20px; line-height: 1; cursor: pointer;
  }
  .nav-btn:active { background: rgba(100,120,255,0.15); }
  .minimap { position: relative; flex: 1; height: 34px; border-radius: 6px; overflow: hidden; background: #14141c; touch-action: none; cursor: grab; }
  .mini-key { position: absolute; top: 0; }
  .mini-white { height: 100%; background: #d4d4e2; box-shadow: inset -1px 0 0 #6a6a7a; }
  .mini-black { height: 58%; background: #15151d; z-index: 1; }
  .mini-key.drone-pc { background: var(--drone); }
  .mini-key.active { background: #6677ee; }
  .mini-label { position: absolute; bottom: 1px; font-family: var(--mono); font-size: 7px; color: #55556a; pointer-events: none; z-index: 1; padding-left: 1px; }
  .mini-window {
    position: absolute; top: 0; bottom: 0; border: 2px solid #aabbff; border-radius: 5px;
    background: rgba(100,120,255,0.12); box-shadow: 0 0 0 999px rgba(0,0,0,0.4); pointer-events: none; z-index: 2;
  }

  /* ── Colonnes ── */
  .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  @media (min-width: 900px) {
    .main { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
  }

  /* ── Infos accord ── */
  .chord-info { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .notes-display { min-height: 28px; display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .note-tag {
    background: rgba(100,120,255,0.14); border: 1px solid rgba(100,120,255,0.32); color: #aabbff;
    border-radius: 6px; padding: 4px 9px; font-family: var(--mono); font-size: 11px; cursor: pointer;
  }
  .notes-placeholder { color: rgba(255,255,255,0.2); font-family: var(--mono); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; align-self: center; }
  .chord-name { font-size: 20px; font-weight: 300; letter-spacing: 2px; color: rgba(150,180,255,0.75); min-height: 24px; font-style: italic; }
  .degree-display {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: var(--mono); font-size: 11px; color: rgba(255,200,120,0.9);
    height: 0; opacity: 0; overflow: hidden; transition: opacity 0.25s, height 0.25s;
  }
  .degree-display.show { height: 28px; opacity: 1; }
  .degree-note { background: rgba(255,190,80,0.15); border: 1px solid rgba(255,190,80,0.35); border-radius: 6px; padding: 3px 9px; color: #ffcc88; }
  .degree-label { color: rgba(255,210,150,0.8); }

  /* ── Boutons génériques ── */
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn {
    min-height: 44px; padding: 0 16px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14); background: transparent;
    color: rgba(255,255,255,0.6); font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .btn:active:not(:disabled) { background: rgba(255,255,255,0.06); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(135deg, #5566ee, #4455cc); border-color: transparent; color: #fff; box-shadow: 0 4px 18px rgba(80,100,220,0.35); }
  .btn.primary:disabled { background: rgba(80,100,200,0.2); box-shadow: none; }
  .btn.stop { background: linear-gradient(135deg, #ee4455, #cc3344); border-color: transparent; color: #fff; box-shadow: 0 4px 18px rgba(220,60,70,0.35); }
  .btn.small { min-height: 38px; padding: 0 12px; font-size: 9px; }
  .btn.icon { padding: 0; width: 44px; font-size: 16px; letter-spacing: 0; }
  .btn.danger { color: #ee8877; border-color: rgba(238,136,119,0.3); }
  .btn.on { border-color: rgba(100,120,255,0.55); color: #aabbff; background: rgba(100,120,255,0.13); }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; overflow: hidden; }
  .seg .btn { border: none; border-radius: 0; }
  .seg .btn.on.listen { color: #ffcc77; background: rgba(230,180,80,0.13); }

  /* ── Suite d'accords ── */
  .seq {
    border: 1px solid var(--border); background: var(--surface); border-radius: 14px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .seq-head { display: flex; align-items: center; gap: 8px; }
  .seq-name {
    flex: 1; min-width: 0; text-align: left; background: none; border: none; cursor: pointer;
    font-size: 21px; font-weight: 400; letter-spacing: 1px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 40px;
  }
  .seq-name small { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-left: 6px; }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; min-height: 66px; }
  .cell {
    position: relative;
    flex: none; min-width: 72px; height: 58px; padding: 0 10px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.03);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer;
    transition: background 0.12s, border-color 0.12s, box-shadow 0.12s, transform 0.18s ease;
    touch-action: pan-x;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  .cell.dragging {
    z-index: 5; cursor: grabbing;
    transition: box-shadow 0.15s, background 0.15s;
    background: rgba(60,70,140,0.95); border-color: #aabbff;
    box-shadow: 0 10px 28px rgba(0,0,0,0.6), 0 0 0 1px #aabbff;
  }
  .strip.drag-mode { scroll-behavior: auto; }
  .cell-name { font-size: 17px; font-style: italic; color: #c8d0f5; white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
  .cell-beats { font-family: var(--mono); font-size: 8px; color: var(--muted); letter-spacing: 1px; }
  .cell.sel { border-color: #aabbff; box-shadow: 0 0 0 1px #aabbff inset; }
  .cell.playing { background: linear-gradient(135deg, rgba(102,119,255,0.55), rgba(68,85,204,0.45)); border-color: #aabbff; box-shadow: 0 0 18px rgba(100,130,255,0.45); }
  .cell.playing .cell-name { color: #fff; }
  .strip-empty { align-self: center; color: rgba(255,255,255,0.25); font-family: var(--mono); font-size: 10px; letter-spacing: 1px; padding: 0 4px; }
  .cell-actions { display: none; flex-direction: column; gap: 8px; padding-top: 2px; border-top: 1px dashed rgba(255,255,255,0.08); padding-top: 10px; }
  .cell-actions.show { display: flex; }
  .cell-actions .btn.small { padding: 0 10px; letter-spacing: 1px; }
  .cell-actions .btn.icon { width: 40px; padding: 0; }
  .beats { display: flex; align-items: center; gap: 5px; justify-content: center; flex-wrap: wrap; }
  .beats-label { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
  .beat-btn { min-width: 38px; }

  .transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px; }
  .transport .btn.primary, .transport .btn.stop { min-width: 110px; font-size: 11px; }
  .bpm { display: inline-flex; align-items: center; gap: 4px; }
  .bpm input {
    width: 58px; height: 44px; text-align: center; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.25); color: var(--text);
    font-family: var(--mono); font-size: 16px;
  }
  .bpm-label { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 2px; }

  /* ── Panneaux repliables ── */
  details.panel { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; transition: border-color 0.3s, box-shadow 0.3s; }
  details.panel > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; min-height: 50px;
  }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::after { content: '▾'; color: var(--muted); font-size: 12px; transition: transform 0.2s; }
  details.panel[open] > summary::after { transform: rotate(180deg); }
  .panel-title { font-family: var(--mono); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .panel-extra { flex: 1; min-width: 0; text-align: right; font-family: var(--mono); font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 11px; }

  /* toggles */
  .toggle-wrap { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 40px; }
  .label { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .toggle { flex: none; width: 38px; height: 22px; background: rgba(255,255,255,0.1); border-radius: 11px; position: relative; border: 1px solid rgba(255,255,255,0.1); transition: background 0.3s; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform 0.3s; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
  .toggle.on { background: rgba(85,102,238,0.6); }
  .toggle.on::after { transform: translateX(16px); }
  .toggle.drone.on { background: rgba(79,209,181,0.55); }

  /* bourdon */
  details.panel.drone-on { border-color: rgba(79,209,181,0.35); box-shadow: 0 0 30px rgba(79,209,181,0.08); }
  details.panel.drone-on .panel-title, details.panel.drone-on .panel-extra { color: var(--drone); }
  .drone-notes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  @media (min-width: 520px) and (max-width: 899px) { .drone-notes { grid-template-columns: repeat(12, minmax(0, 1fr)); } }
  .drone-note {
    min-width: 0; min-height: 38px; font-family: var(--mono); font-size: 10px;
    border: 1px solid rgba(255,255,255,0.12); background: transparent; color: rgba(255,255,255,0.55); border-radius: 7px; cursor: pointer;
  }
  .drone-note.sharp { background: rgba(0,0,0,0.4); color: rgba(255,255,255,0.35); }
  .drone-note.active { border-color: rgba(79,209,181,0.65); color: #7fe6cf; background: rgba(79,209,181,0.15); }
  .drone-opts { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .oct-val { font-family: var(--mono); font-size: 12px; min-width: 14px; text-align: center; color: #aabbcc; }
  input.vol { -webkit-appearance: none; appearance: none; width: 110px; height: 2px; background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; }
  input.vol::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #7fe6cf; border: none; }
  input.vol::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #7fe6cf; border: none; }

  /* bibliothèque */
  .lib-list { display: flex; flex-direction: column; gap: 4px; max-height: 280px; overflow-y: auto; }
  .lib-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 12px; border-radius: 9px; cursor: pointer; text-align: left;
    border: 1px solid transparent; background: rgba(255,255,255,0.025);
  }
  .lib-item.cur { border-color: rgba(100,120,255,0.45); background: rgba(100,120,255,0.1); }
  .lib-name { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-meta { font-family: var(--mono); font-size: 9px; color: var(--muted); white-space: nowrap; }
  .lib-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .lib-actions .btn { padding: 0 4px; font-size: 8.5px; letter-spacing: 1px; }
  .sync-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sync-state { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--muted); flex: 1; }
  .sync-state.ok { color: #44bb77; } .sync-state.err { color: #cc6644; } .sync-state.warn { color: #ccaa55; }
  .code-input {
    flex: 1; min-width: 120px; height: 40px; border-radius: 9px; padding: 0 10px;
    border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.25); color: var(--text); font-family: var(--mono); font-size: 16px;
  }

  .hint { font-family: var(--mono); font-size: 9px; color: rgba(255,255,255,0.2); letter-spacing: 1px; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <span class="header-title">Piano</span>
      <span class="header-sub">Chords · Drone</span>
    </div>
    <div class="status loading" id="status">⟳ Chargement…</div>
  </header>
  <div class="progress-wrap" id="progressWrap"><div class="progress-bar"></div></div>

  <div class="piano-wrap" id="pianoWrap"><div class="keyboard" id="keyboard"></div></div>
  <div class="nav-row">
    <button class="nav-btn" onclick="shiftOctave(-1)" aria-label="Octave précédente">‹</button>
    <div class="minimap" id="minimap"><div id="miniKeys"></div><div class="mini-window" id="miniWindow"></div></div>
    <button class="nav-btn" onclick="shiftOctave(1)" aria-label="Octave suivante">›</button>
  </div>

  <div class="main">
    <section class="col">

      <div class="chord-info">
        <div class="notes-display" id="notesDisplay"></div>
        <div class="chord-name" id="chordName"></div>
        <div class="degree-display" id="degreeDisplay"></div>
      </div>

      <div class="row">
        <div class="seg">
          <button class="btn small on" id="btnModeEdit" onclick="setMode('edit')">Éditer</button>
          <button class="btn small listen" id="btnModeListen" disabled onclick="setMode('listen')">Écouter</button>
        </div>
        <button class="btn small" id="btnClear" disabled onclick="clearAll()">Effacer</button>
        <button class="btn small primary" id="btnPlay" disabled onclick="togglePlay()">▶ Accord</button>
      </div>

      <div class="seq">
        <div class="seq-head">
          <button class="seq-name" id="seqName" onclick="renameProg()"></button>
          <button class="btn primary small" id="btnAdd" disabled onclick="addChord()">+ Ajouter</button>
        </div>

        <div class="strip" id="strip"></div>

        <div class="cell-actions" id="cellActions">
          <div class="row">
            <button class="btn small" id="btnReplace" onclick="replaceCell()">Remplacer</button>
            <button class="btn small" onclick="renameCell()">Renommer</button>
            <button class="btn small" onclick="duplicateCell()">Dupliquer</button>
            <button class="btn small icon danger" onclick="deleteCell()" aria-label="Supprimer">✕</button>
          </div>
          <div class="beats" id="beats"><span class="beats-label">Temps</span></div>
        </div>

        <div class="transport">
          <button class="btn primary" id="btnSeqPlay" onclick="toggleSeq()">▶ Lire</button>
          <button class="btn" id="btnNext" onclick="nextChord()">Suivant ›</button>
          <div class="bpm">
            <button class="btn small icon" onclick="nudgeBpm(-1)" aria-label="Tempo moins">−</button>
            <input id="bpmInput" type="number" inputmode="numeric" min="40" max="200" onchange="setBpm(this.value)">
            <button class="btn small icon" onclick="nudgeBpm(1)" aria-label="Tempo plus">+</button>
            <span class="bpm-label">BPM</span>
          </div>
          <button class="btn small" id="btnLoop" onclick="toggleLoop()">⟳ Boucle</button>
        </div>
      </div>

      <div class="hint" id="hint">Touche une case pour l'entendre (re-touche pour couper) · Appui long puis glisser pour la déplacer · Lire enchaîne la suite au tempo</div>
    </section>

    <section class="col">
      <details class="panel" id="panelLib">
        <summary><span class="panel-title">Bibliothèque</span><span class="panel-extra" id="libSummary"></span></summary>
        <div class="panel-body">
          <div class="lib-list" id="libList"></div>
          <div class="lib-actions">
            <button class="btn small" onclick="newProg()">Nouvelle</button>
            <button class="btn small" onclick="renameProg()">Renommer</button>
            <button class="btn small" onclick="duplicateProg()">Dupliquer</button>
            <button class="btn small danger" onclick="deleteProg()">Supprimer</button>
          </div>
          <div class="sync-row">
            <span class="sync-state" id="syncState"></span>
            <button class="btn small" id="btnShowCode" onclick="showCodeInput(true)">Code</button>
          </div>
          <div class="sync-row" id="codeRow" style="display:none">
            <input class="code-input" id="codeInput" type="password" autocomplete="current-password" placeholder="Code d'accès">
            <button class="btn small primary" onclick="saveCode()">OK</button>
          </div>
        </div>
      </details>

      <details class="panel" id="panelDrone">
        <summary>
          <span class="panel-title">Bourdon</span>
          <span class="panel-extra" id="droneCurrent"></span>
          <span class="toggle drone" id="droneToggle" onclick="event.preventDefault(); event.stopPropagation(); toggleDrone()"></span>
        </summary>
        <div class="panel-body">
          <div class="drone-notes" id="droneNotes"></div>
          <div class="drone-opts">
            <div class="toggle-wrap">
              <span class="label">Oct</span>
              <button class="btn small icon" id="octDown" onclick="shiftDroneOct(-1)">−</button>
              <span class="oct-val" id="octVal">2</span>
              <button class="btn small icon" id="octUp" onclick="shiftDroneOct(1)">+</button>
            </div>
            <div class="toggle-wrap" onclick="toggleDroneFifth()">
              <span class="label">Quinte</span><span class="toggle drone" id="fifthToggle"></span>
            </div>
            <div class="toggle-wrap">
              <span class="label">Vol</span>
              <input type="range" class="vol" id="droneVol" min="-40" max="0" step="1" oninput="setDroneVol(this.value)">
            </div>
          </div>
        </div>
      </details>

      <details class="panel" id="panelSound">
        <summary><span class="panel-title">Son</span><span class="panel-extra" id="soundSummary">Piano</span></summary>
        <div class="panel-body">
          <div class="seg" style="align-self:flex-start">
            <button class="btn small on" id="btnPiano" onclick="setTimbre('piano')">Piano</button>
            <button class="btn small" id="btnStrings" onclick="setTimbre('strings')">Cordes</button>
          </div>
          <div class="row" style="justify-content:flex-start; gap:18px">
            <div class="toggle-wrap" onclick="toggleReverb()"><span class="label">Reverb</span><span class="toggle on" id="reverbToggle"></span></div>
            <div class="toggle-wrap" onclick="toggleSoloCut()"><span class="label">Note seule coupe l'accord</span><span class="toggle" id="soloCutToggle"></span></div>
          </div>
        </div>
      </details>
    </section>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  Utilitaires
// ═══════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
function lsGet(k, fallback) { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ═══════════════════════════════════════════════════════════
//  Clavier
// ═══════════════════════════════════════════════════════════
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const BLACK_INDICES = new Set([1,3,6,8,10]);

function generateKeys(startOct, numOct) {
  const keys = [];
  for (let o = startOct; o < startOct + numOct; o++)
    for (let i = 0; i < 12; i++)
      keys.push({ note: NOTE_NAMES[i], octave: o, id: `${NOTE_NAMES[i]}${o}`, isBlack: BLACK_INDICES.has(i), noteIdx: i });
  keys.push({ note: "C", octave: startOct + numOct, id: `C${startOct + numOct}`, isBlack: false, noteIdx: 0 });
  return keys;
}
const ALL_KEYS = generateKeys(1, 7);            // C1 → C8
const KEY_BY_ID = {}; ALL_KEYS.forEach(k => KEY_BY_ID[k.id] = k);
const WHITE_KEYS = ALL_KEYS.filter(k => !k.isBlack);
const pitchOf = id => { const k = KEY_BY_ID[id]; return k ? k.octave * 12 + k.noteIdx : 0; };
const sortIds = ids => [...ids].filter(id => KEY_BY_ID[id]).sort((a, b) => pitchOf(a) - pitchOf(b));

const keyboard = $('keyboard');
const WHITE_W = 36, WHITE_H = 150, BLACK_W = 22;
const totalWidth = WHITE_KEYS.length * WHITE_W;
keyboard.style.width = totalWidth + 'px';
keyboard.style.height = WHITE_H + 'px';

function bindKey(el, id) {
  el.addEventListener('touchstart', e => { e.preventDefault(); onKeyPress(id); }, { passive: false });
  el.addEventListener('mousedown', e => { e.preventDefault(); onKeyPress(id); });
}
WHITE_KEYS.forEach((key, i) => {
  const el = document.createElement('div');
  el.className = 'white-key';
  el.id = 'key_' + key.id;
  el.style.left = (i * WHITE_W) + 'px';
  if (key.note === 'C') el.textContent = `C${key.octave}`;
  bindKey(el, key.id);
  keyboard.appendChild(el);
  if ([0,2,5,7,9].includes(key.noteIdx) && i < WHITE_KEYS.length - 1) {
    const blackId = NOTE_NAMES[key.noteIdx + 1] + key.octave;
    const bel = document.createElement('div');
    bel.className = 'black-key';
    bel.id = 'key_' + blackId;
    bel.style.left = (i * WHITE_W + WHITE_W - BLACK_W / 2) + 'px';
    bindKey(bel, blackId);
    keyboard.appendChild(bel);
  }
});

// ── Mini-carte + flèches d'octave ──
const pianoWrap = $('pianoWrap'), minimap = $('minimap'), miniKeys = $('miniKeys'), miniWindow = $('miniWindow');
const KB_PAD = 16;
const FULL_W = totalWidth + 2 * KB_PAD;
const pct = px => (px / FULL_W * 100) + '%';
WHITE_KEYS.forEach((key, i) => {
  const x = KB_PAD + i * WHITE_W;
  const m = document.createElement('div');
  m.className = 'mini-key mini-white'; m.id = 'mini_' + key.id;
  m.style.left = pct(x); m.style.width = pct(WHITE_W);
  miniKeys.appendChild(m);
  if (key.note === 'C') {
    const l = document.createElement('span');
    l.className = 'mini-label'; l.textContent = key.octave; l.style.left = pct(x);
    miniKeys.appendChild(l);
  }
  if ([0,2,5,7,9].includes(key.noteIdx) && i < WHITE_KEYS.length - 1) {
    const b = document.createElement('div');
    b.className = 'mini-key mini-black'; b.id = 'mini_' + NOTE_NAMES[key.noteIdx + 1] + key.octave;
    b.style.left = pct(x + WHITE_W - BLACK_W / 2); b.style.width = pct(BLACK_W);
    miniKeys.appendChild(b);
  }
});
function updateMiniWindow() {
  const sw = pianoWrap.scrollWidth;
  miniWindow.style.left = (pianoWrap.scrollLeft / sw * 100) + '%';
  miniWindow.style.width = (pianoWrap.clientWidth / sw * 100) + '%';
}
let scrollSaveTimer = null;
pianoWrap.addEventListener('scroll', () => {
  updateMiniWindow();
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(() => lsSet('pianoScroll', pianoWrap.scrollLeft), 300);
}, { passive: true });
window.addEventListener('resize', updateMiniWindow);
pianoWrap.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); pianoWrap.scrollLeft += e.deltaY; }
}, { passive: false });

let miniDrag = false, miniGrabOffset = 0;
function scrollMiniTo(clientX) {
  const r = minimap.getBoundingClientRect();
  const f = (clientX - miniGrabOffset - r.left) / r.width;
  pianoWrap.scrollLeft = f * pianoWrap.scrollWidth - pianoWrap.clientWidth / 2;
}
minimap.addEventListener('pointerdown', e => {
  const w = miniWindow.getBoundingClientRect();
  miniGrabOffset = (e.clientX >= w.left && e.clientX <= w.right) ? e.clientX - (w.left + w.width / 2) : 0;
  miniDrag = true;
  minimap.setPointerCapture(e.pointerId);
  scrollMiniTo(e.clientX);
});
minimap.addEventListener('pointermove', e => { if (miniDrag) scrollMiniTo(e.clientX); });
['pointerup', 'pointercancel'].forEach(t => minimap.addEventListener(t, () => { miniDrag = false; }));

function shiftOctave(d) {
  const cur = Math.round((pianoWrap.scrollLeft + 8 - KB_PAD) / WHITE_W);
  let base = d > 0 ? Math.floor(cur / 7) * 7 + 7 : Math.ceil(cur / 7) * 7 - 7;
  base = Math.max(0, Math.min(WHITE_KEYS.length - 1, base));
  pianoWrap.scrollTo({ left: KB_PAD + base * WHITE_W - 8, behavior: 'smooth' });
}
// Fait apparaître des notes si elles sont hors du champ du clavier
function revealNotes(ids) {
  if (!ids.length) return;
  const els = ids.map(id => $('key_' + id)).filter(Boolean);
  if (!els.length) return;
  const lo = KB_PAD + Math.min(...els.map(e => e.offsetLeft));
  const hi = KB_PAD + Math.max(...els.map(e => e.offsetLeft + e.offsetWidth));
  const vl = pianoWrap.scrollLeft, vr = vl + pianoWrap.clientWidth;
  if (lo >= vl + 4 && hi <= vr - 4) return;
  pianoWrap.scrollTo({ left: (lo + hi) / 2 - pianoWrap.clientWidth / 2, behavior: 'smooth' });
}

// ═══════════════════════════════════════════════════════════
//  État de l'éditeur d'accord (clavier)
// ═══════════════════════════════════════════════════════════
const selected = new Set();
let mode = 'edit';
let soloCut = false;
let degreeTimer = null;

const notesDisplay = $('notesDisplay'), chordName = $('chordName'), degreeDisplay = $('degreeDisplay');
const btnClear = $('btnClear'), btnPlay = $('btnPlay'), btnModeEdit = $('btnModeEdit'), btnModeListen = $('btnModeListen');
const statusEl = $('status'), progressWrap = $('progressWrap');

function getSortedNotes() { return sortIds(selected); }

function onKeyPress(id) {
  if (mode === 'edit') toggleNote(id);
  else soloNote(id);
}
function toggleNote(id) {
  if (selected.has(id)) { selected.delete(id); $('key_' + id)?.classList.remove('active'); }
  else { selected.add(id); $('key_' + id)?.classList.add('active'); }
  updateUI();
}
function setSelectedNotes(ids) {
  selected.forEach(id => $('key_' + id)?.classList.remove('active'));
  selected.clear();
  ids.forEach(id => { if (KEY_BY_ID[id]) { selected.add(id); $('key_' + id)?.classList.add('active'); } });
  updateUI();
}
function clearAll() {
  if (playState === 'chord') stopAll();
  setSelectedNotes([]);
}

const DEGREE_NAMES = [
  'fondamentale', 'seconde mineure (b9)', 'seconde majeure (9)', 'tierce mineure (#9)',
  'tierce majeure', 'quarte juste (11)', 'quinte diminuée (#11 / b5)', 'quinte juste',
  'quinte augmentée (#5 / b13)', 'sixte majeure (13)', 'septième mineure', 'septième majeure'
];
function degreeOf(id) {
  const notes = getSortedNotes();
  if (!notes.length) return '';
  const k = KEY_BY_ID[id]; if (!k) return '';
  const ref = drone.on ? drone.pc : KEY_BY_ID[notes[0]].noteIdx;   // bourdon actif → relatif au bourdon
  let label = DEGREE_NAMES[(k.noteIdx - ref + 12) % 12];
  if (drone.on) label += ` · / bourdon ${NOTE_NAMES[drone.pc]}`;
  if (notes.filter(n => KEY_BY_ID[n].note === k.note).length > 1) label += ' · doublée';
  return label;
}
function showDegree(id) {
  degreeDisplay.innerHTML = `<span class="degree-note">${id}</span><span class="degree-label">${degreeOf(id)}</span>`;
  degreeDisplay.classList.add('show');
  clearTimeout(degreeTimer);
  degreeTimer = setTimeout(() => degreeDisplay.classList.remove('show'), 3500);
}
async function soloNote(id) {
  if (!samplerReady || !selected.has(id)) return;
  await Tone.start();
  if (soloCut && playState !== 'idle') stopAll();
  try { sampler.triggerAttackRelease(id, 2.4); } catch (e) {}
  const el = $('key_' + id);
  if (el) { el.classList.add('solo'); setTimeout(() => el.classList.remove('solo'), 420); }
  showDegree(id);
}
function setMode(m) {
  if (m === 'listen' && selected.size === 0) return;
  mode = m;
  document.body.classList.toggle('listen-mode', m === 'listen');
  btnModeEdit.classList.toggle('on', m === 'edit');
  btnModeListen.classList.toggle('on', m === 'listen');
  degreeDisplay.classList.remove('show');
}
function toggleSoloCut() { soloCut = !soloCut; $('soloCutToggle').classList.toggle('on', soloCut); }

function detectChord(ids) {
  if (ids.length < 2) return '';
  const idxs = ids.map(id => KEY_BY_ID[id].noteIdx);
  const root = idxs[0], r = NOTE_NAMES[root];
  const s = new Set(idxs.map(i => (i - root + 12) % 12));
  if (s.has(4) && s.has(7) && s.has(11)) return r + ' maj7';
  if (s.has(3) && s.has(7) && s.has(10)) return r + ' m7';
  if (s.has(4) && s.has(7) && s.has(10)) return r + '7';
  if (s.has(3) && s.has(6) && s.has(10)) return r + ' m7b5';
  if (s.has(4) && s.has(7)) return r + ' maj';
  if (s.has(3) && s.has(7)) return r + ' min';
  if (s.has(3) && s.has(6)) return r + ' dim';
  if (s.has(4) && s.has(8)) return r + ' aug';
  if (s.has(5) && s.has(7)) return r + ' sus4';
  if (s.has(2) && s.has(7)) return r + ' sus2';
  return '';
}
// Nom affiché sur une case : accord détecté, sinon les notes sans octave
function chordLabel(ids) {
  const sorted = sortIds(ids);
  const d = detectChord(sorted);
  if (d) return d.endsWith(' maj') ? d.slice(0, -4) : d.endsWith(' min') ? d.slice(0, -4) + 'm' : d.replace(' ', '');
  return [...new Set(sorted.map(id => KEY_BY_ID[id].note))].join(' ');
}

function updateUI() {
  const notes = getSortedNotes();
  if (!notes.length) {
    notesDisplay.innerHTML = '<span class="notes-placeholder">Sélectionne des notes</span>';
    chordName.textContent = '';
    btnModeListen.disabled = true;
    if (mode === 'listen') setMode('edit');
  } else {
    notesDisplay.innerHTML = notes.map(n => `<span class="note-tag" onclick="soloNote('${n}')">${n}</span>`).join('');
    chordName.textContent = detectChord(notes);
    btnModeListen.disabled = false;
  }
  btnClear.disabled = !notes.length;
  btnPlay.disabled = playState === 'chord' ? false : (!samplerReady || !notes.length);
  btnPlay.textContent = playState === 'chord' ? '■ Stop' : '▶ Accord';
  btnPlay.className = 'btn small ' + (playState === 'chord' ? 'stop' : 'primary');
  $('btnAdd').disabled = !notes.length;
  $('btnReplace').disabled = !notes.length;
  refreshMiniNotes();
}
function refreshMiniNotes() {
  let droneOn = false, dronePc = -1;
  try { droneOn = drone.on; dronePc = drone.pc; } catch (e) {}
  ALL_KEYS.forEach(k => {
    const m = $('mini_' + k.id); if (!m) return;
    m.classList.toggle('active', selected.has(k.id));
    m.classList.toggle('drone-pc', droneOn && k.noteIdx === dronePc);
  });
}

// ═══════════════════════════════════════════════════════════
//  Audio : Tone.js, samplers, reverb
// ═══════════════════════════════════════════════════════════
let Tone = null, reverb = null;
let reverbOn = true;
let samplerReady = false;
let samplers = { piano: null, strings: null };
let samplerLoaded = { piano: false, strings: false };
let samplerLoading = { piano: false, strings: false };
let currentTimbre = 'piano';
let sampler = null;

// playState : 'idle' | 'chord' (▶ Accord) | 'manual' (case tenue) | 'auto' (suite au tempo)
let playState = 'idle';
let held = [];     // notes actuellement tenues par l'accord ou la suite

function releaseHeld(time) {
  if (held.length && sampler) { try { sampler.triggerRelease(held, time); } catch (e) {} }
  held = [];
}
function holdChord(notes, time) {
  releaseHeld(time);
  if (!sampler || !samplerReady || !notes.length) return;
  try { sampler.triggerAttack(notes, time); } catch (e) {}
  held = notes.slice();
}
async function audioStart() {
  if (!Tone) return false;
  await Tone.start();
  return true;
}

async function togglePlay() {
  if (playState === 'chord') { stopAll(); return; }
  if (!samplerReady || !selected.size) return;
  await audioStart();
  stopAll();
  holdChord(getSortedNotes());
  playState = 'chord';
  updateUI(); renderTransport();
}

function setReady(label, isError) {
  samplerReady = true;
  progressWrap.style.display = 'none';
  statusEl.className = 'status ' + (isError ? 'error' : 'ready');
  statusEl.textContent = '◈ ' + label;
  updateUI(); renderTransport();
}
function reconnectSampler() {
  if (!sampler) return;
  sampler.disconnect();
  if (reverbOn) sampler.connect(reverb); else sampler.toDestination();
}
function toggleReverb() {
  reverbOn = !reverbOn;
  $('reverbToggle').classList.toggle('on', reverbOn);
  reconnectSampler(); reconnectDrone();
}
async function setTimbre(t) {
  if (currentTimbre === t) return;
  stopAll();
  currentTimbre = t;
  $('btnPiano').classList.toggle('on', t === 'piano');
  $('btnStrings').classList.toggle('on', t === 'strings');
  $('soundSummary').textContent = t === 'piano' ? 'Piano' : 'Cordes';
  if (samplerLoaded[t]) {
    sampler = samplers[t];
    reconnectSampler();
    setReady(t === 'piano' ? 'Salamander Grand Piano' : 'FluidR3 String Ensemble');
  } else if (Tone) {
    samplerReady = false;
    updateUI(); renderTransport();
    loadStringsSampler();
  }
}

const SALAMANDER_NOTES = ["A0","C1","D#1","F#1","A1","C2","D#2","F#2","A2","C3","D#3","F#3","A3","C4","D#4","F#4","A4","C5","D#5","F#5","A5","C6","D#6","F#6","A6","C7","D#7","F#7","A7","C8"];
const STRINGS_NOTES    = ["A2","C3","D#3","F#3","A3","C4","D#4","F#4","A4","C5","D#5","F#5","A5","C6","D#6","F#6","A6"];

function useFallback(name, opts, label) {
  const fs = new Tone.PolySynth(Tone.Synth, opts);
  samplers[name] = fs; samplerLoaded[name] = true;
  if (currentTimbre === name) { sampler = fs; reconnectSampler(); setReady(label, true); }
}
function buildPianoSampler(ToneLib) {
  Tone = ToneLib;
  reverb = new Tone.Reverb({ decay: 3.5, wet: 0.38 }).toDestination();
  reverb.generate();
  buildDrone();
  const urls = {};
  SALAMANDER_NOTES.forEach(n => urls[n] = n.replace('#', 's') + '.mp3');
  samplerLoading.piano = true;
  const s = new Tone.Sampler({
    urls, release: 0.35,
    baseUrl: 'https://tonejs.github.io/audio/salamander/',
    onload: () => {
      samplers.piano = s; samplerLoaded.piano = true;
      if (currentTimbre === 'piano') { sampler = s; reconnectSampler(); setReady('Salamander Grand Piano'); }
    },
    onerror: () => useFallback('piano', { oscillator: { type: 'triangle' }, envelope: { attack: 0.02, decay: 0.4, sustain: 0.5, release: 0.6 }, volume: -4 }, 'Synthèse (fallback)')
  });
}
function loadStringsSampler() {
  if (!Tone || samplerLoading.strings) return;
  samplerLoading.strings = true;
  progressWrap.style.display = '';
  statusEl.className = 'status loading';
  statusEl.textContent = '⟳ Chargement cordes…';
  const urls = {};
  STRINGS_NOTES.forEach(n => urls[n] = n.replace('#', 's') + '.mp3');
  const s = new Tone.Sampler({
    urls, release: 0.6,
    baseUrl: 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/string_ensemble_1-mp3/',
    onload: () => {
      samplers.strings = s; samplerLoaded.strings = true;
      if (currentTimbre === 'strings') { sampler = s; reconnectSampler(); setReady('FluidR3 String Ensemble'); }
    },
    onerror: () => useFallback('strings', { oscillator: { type: 'sawtooth' }, envelope: { attack: 0.4, decay: 0.2, sustain: 0.8, release: 0.8 }, volume: -8 }, 'Synth cordes (fallback)')
  });
}

// ═══════════════════════════════════════════════════════════
//  Bourdon (drone)
// ═══════════════════════════════════════════════════════════
const DRONE_OCT_MIN = 1, DRONE_OCT_MAX = 4;
const drone = Object.assign({ pc: 0, octave: 2, fifth: false, vol: -12 }, lsGet('pianoDrone', {}), { on: false });
let droneSynth = null, droneOut = null, droneSounding = [];

NOTE_NAMES.forEach((n, i) => {
  const b = document.createElement('button');
  b.className = 'drone-note' + (BLACK_INDICES.has(i) ? ' sharp' : '');
  b.textContent = n;
  b.onclick = () => setDronePc(i);
  $('droneNotes').appendChild(b);
});
$('droneVol').value = drone.vol;

function buildDrone() {
  droneOut = new Tone.Gain(Tone.dbToGain(drone.vol));
  const filter = new Tone.Filter({ type: 'lowpass', frequency: 900, Q: 0.6 }).connect(droneOut);
  new Tone.LFO({ frequency: 0.07, min: 550, max: 1300 }).start().connect(filter.frequency);
  droneSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'fatsawtooth', count: 3, spread: 14 },
    envelope: { attack: 1.5, decay: 0.2, sustain: 1, release: 2.2 },
    volume: -14

// Suite : { id, name, bpm, loop, drone:{pc,octave,fifth}, chords:[{id, notes:[...], beats}], updatedAt, deleted? }
const LIB_KEY = 'pianoLibrary';
let lib = lsGet(LIB_KEY, null) || { items: {}, currentId: null };
let prog = null;

// Complète les champs manquants (données venant d'une ancienne version ou du serveur)
function normalize(p) {
  if (!p || p.deleted) return p;
  if (!Array.isArray(p.chords)) p.chords = [];
  p.chords.forEach(c => {
    if (!c.id) c.id = uid();
    if (!BEAT_CHOICES.includes(c.beats)) c.beats = 4;
    c.notes = sortIds(c.notes || []);
    if (typeof c.label !== 'string' || !c.label.trim()) delete c.label;
  });
  if (!(p.bpm >= 40 && p.bpm <= 200)) p.bpm = 80;
  if (typeof p.loop !== 'boolean') p.loop = true;
  if (!p.name) p.name = 'Sans titre';

}

}

      // Elle n'est pas envoyée au serveur et disparaît si le serveur a déjà des suites.

  lib.items[prog.id] = { id: prog.id, deleted: true, updatedAt: Date.now() };

// ── Synchro ──
// Le serveur garde, pour chaque suite, la version la plus récente (updatedAt).

  if (syncing) { syncAgain = true; return; }

  setSync('busy');
  try {
    const r = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-access-code': accessCode },
      body: JSON.stringify({ items: Object.values(lib.items).filter(p => !p.pristine) })

const BEAT_CHOICES = [1, 2, 3, 4, 6, 8];

// ── Réordonner : appui long sur une case puis glisser ──
const LONG_PRESS_MS = 350, MOVE_TOL = 8, EDGE = 44;

  const cell = e.target.closest('.cell');
  if (!cell || drag) return;

  const idx = [...stripEl.querySelectorAll('.cell')].indexOf(cell);
  drag = { idx, cell, pointerId: e.pointerId, type: e.pointerType, x0: e.clientX, y0: e.clientY, x: e.clientX, active: false };

  playState = 'idle';
  playIdx = -1;
  if (prog) { renderStrip(); renderTransport(); }
  updateUI();
}

// ═══════════════════════════════════════════════════════════
//  Démarrage
// ═══════════════════════════════════════════════════════════
ensureProg();
Object.assign(drone, prog.drone || {});
renderDrone();
renderAllSeq();
updateUI();

if (matchMedia('(min-width: 900px)').matches) {
  ['panelLib', 'panelDrone', 'panelSound'].forEach(id => $(id).open = true);
}
requestAnimationFrame(() => {
  const saved = lsGet('pianoScroll', null);
  const c3 = WHITE_KEYS.findIndex(k => k.id === 'C3');
  pianoWrap.scrollLeft = saved !== null ? +saved : KB_PAD + c3 * WHITE_W - 8;
  updateMiniWindow();
});

(function loadTone() {
  statusEl.textContent = '⟳ Chargement Tone.js…';
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js';
  script.onload = () => {
    statusEl.textContent = '⟳ Chargement piano…';
    buildPianoSampler(window.Tone);
    Tone.Transport.bpm.value = prog.bpm;
  };
  script.onerror = () => {
    statusEl.className = 'status error';
    statusEl.textContent = '✕ Échec chargement — vérifier la connexion';
  };
  document.head.appendChild(script);
})();

sync();
</script>
</body>
</html>
