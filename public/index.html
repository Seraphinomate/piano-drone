<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano">
<meta name="theme-color" content="#080810">
<title>Piano — Chord Builder + Drone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=6">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <span class="header-title">Piano</span>
      <span class="header-sub">Chords · Drone</span>
    </div>
    <div class="status loading" id="status">⟳ Chargement…</div>
  </header>
  <div class="progress-wrap" id="progressWrap"><div class="progress-bar"></div></div>

  <div class="piano-wrap" id="pianoWrap"><div class="keyboard" id="keyboard"></div></div>
  <div class="nav-row">
    <button class="nav-btn" onclick="shiftOctave(-1)" aria-label="Octave précédente">‹</button>
    <div class="minimap" id="minimap"><div id="miniKeys"></div><div class="mini-window" id="miniWindow"></div></div>
    <button class="nav-btn" onclick="shiftOctave(1)" aria-label="Octave suivante">›</button>
  </div>

  <div class="main">
    <section class="col" id="colLeft">

      <div class="seg view-seg" id="viewSeg">
        <button class="btn on" id="btnViewSuite" onclick="setView('suite')">Suite</button>
        <button class="btn" id="btnViewPads" onclick="setView('pads')">Pads</button>
      </div>

      <div class="chord-info">
        <div class="notes-display" id="notesDisplay"></div>
        <div class="chord-name" id="chordName"></div>
        <div class="degree-display" id="degreeDisplay"></div>
      </div>

      <div class="row">
        <div class="seg">
          <button class="btn small on" id="btnModeEdit" onclick="setMode('edit')">Éditer</button>
          <button class="btn small listen" id="btnModeListen" disabled onclick="setMode('listen')">Écouter</button>
        </div>
        <button class="btn small" id="btnClear" disabled onclick="clearAll()">Effacer</button>
        <button class="btn small primary" id="btnPlay" disabled onclick="togglePlay()">▶ Accord</button>
      </div>

      <div class="seq" id="seqBlock">
        <div class="seq-head">
          <button class="seq-name" id="seqName" onclick="renameProg()"></button>
          <button class="btn primary small" id="btnAdd" disabled onclick="addChord()">+ Ajouter</button>
        </div>

        <div class="strip" id="strip"></div>

        <div class="cell-actions" id="cellActions">
          <div class="row">
            <button class="btn small" id="btnReplace" onclick="replaceCell()">Remplacer</button>
            <button class="btn small" onclick="renameCell()">Renommer</button>
            <button class="btn small" onclick="duplicateCell()">Dupliquer</button>
            <button class="btn small icon danger" onclick="deleteCell()" aria-label="Supprimer">✕</button>
          </div>
          <div class="beats" id="beats"><span class="beats-label">Temps</span></div>
        </div>

        <div class="transport">
          <button class="btn primary" id="btnSeqPlay" onclick="toggleSeq()">▶ Lire</button>
          <button class="btn" id="btnNext" onclick="nextChord()">Suivant ›</button>
          <div class="bpm">
            <button class="btn small icon" onclick="nudgeBpm(-1)" aria-label="Tempo moins">−</button>
            <input id="bpmInput" type="number" inputmode="numeric" min="40" max="200" onchange="setBpm(this.value)">
            <button class="btn small icon" onclick="nudgeBpm(1)" aria-label="Tempo plus">+</button>
            <span class="bpm-label">BPM</span>
          </div>
          <button class="btn small" id="btnLoop" onclick="toggleLoop()">⟳ Boucle</button>
        </div>
      </div>

      <div class="pads" id="padsBlock" hidden>
        <div class="pads-head">
          <div class="seg" id="padModeSeg">
            <button class="btn small" data-m="libre" onclick="setPadMode('libre')">Libre</button>
            <button class="btn small" data-m="duo" onclick="setPadMode('duo')">Duo</button>
            <button class="btn small" data-m="chaine" onclick="setPadMode('chaine')">Chaîne</button>
          </div>
          <button class="btn small icon" id="btnPadEdit" onclick="togglePadEdit()" aria-label="Modifier les pads">✎</button>
          <div class="menu-wrap">
            <button class="btn small icon" onclick="togglePadMenu(event)" aria-label="Plus d'options">⋯</button>
            <div class="menu" id="padMenu" hidden></div>
          </div>
        </div>
        <div class="pad-help" id="padHelp"></div>

        <div class="pad-stage" id="padStage">
          <!-- Libre : le fil -->
          <div class="stage-libre" id="stageLibre">
            <div class="stage-row">
              <span class="label">Fil</span>
              <div class="chips" id="filChips"></div>
            </div>
            <div class="row stage-actions">
              <button class="btn small" id="btnFilToChain" onclick="filToChain()">→ Chaîne</button>
              <button class="btn small" id="btnFilClear" onclick="clearFil()">Vider</button>
            </div>
          </div>
          <!-- Duo : A → B -->
          <div class="stage-duo" id="stageDuo">
            <button class="duo-slot" id="duoA" onclick="pickNewAnchor()"></button>
            <span class="duo-arrow">→</span>
            <div class="duo-slot b" id="duoB"></div>
          </div>
          <!-- Chaîne -->
          <div class="stage-chain" id="stageChain">
            <div class="chips chain" id="chainChips"></div>
            <div class="row stage-actions">
              <button class="btn small danger" id="btnChainRemove" onclick="removeChainPos()">✕ Retirer</button>
              <button class="btn small" id="btnChainClear" onclick="clearChain()">Vider</button>
            </div>
          </div>
        </div>

        <div class="pad-grid" id="padGrid"></div>

        <div class="pad-edit-bar" id="padEditBar">
          <button class="btn small" onclick="renamePad()">Renommer</button>
          <button class="btn small" id="btnPadReplace" onclick="replacePad()">Remplacer</button>
          <button class="btn small icon" onclick="movePad(-1)" aria-label="Déplacer avant">‹</button>
          <button class="btn small icon" onclick="movePad(1)" aria-label="Déplacer après">›</button>
          <button class="btn small icon danger" onclick="deletePad()" aria-label="Supprimer">✕</button>
        </div>

        <div class="transport pad-transport" id="padTransport">
          <button class="btn primary" id="btnPadStop" onclick="togglePadPlay()" aria-label="Lire / arrêter">▶</button>
          <div class="bpm">
            <button class="btn small icon" onclick="nudgeBpm(-1)" aria-label="Tempo moins">−</button>
            <input id="padBpmInput" type="number" inputmode="numeric" min="40" max="200" onchange="setBpm(this.value)">
            <button class="btn small icon" onclick="nudgeBpm(1)" aria-label="Tempo plus">+</button>
          </div>
          <select class="beats-select" id="padBeats" onchange="setPadBeats(this.value)" aria-label="Durée de chaque accord"></select>
          <button class="btn primary small" id="btnPadToSuite" onclick="padsToSuite()">→ Suite</button>
        </div>
      </div>

      <div class="hint" id="hint">Touche une case pour l'entendre (re-touche pour couper) · Appui long puis glisser pour la déplacer · Lire enchaîne la suite au tempo</div>
    </section>

    <section class="col" id="colRight">
      <details class="panel" id="panelLib">
        <summary><span class="panel-title">Bibliothèque</span><span class="panel-extra" id="libSummary"></span></summary>
        <div class="panel-body">
          <div class="lib-list" id="libList"></div>
          <div class="lib-actions">
            <button class="btn small" onclick="newProg()">Nouvelle</button>
            <button class="btn small" onclick="renameProg()">Renommer</button>
            <button class="btn small" onclick="duplicateProg()">Dupliquer</button>
            <button class="btn small danger" onclick="deleteProg()">Supprimer</button>
          </div>
          <div class="sync-row">
            <span class="sync-state" id="syncState"></span>
            <button class="btn small" id="btnShowCode" onclick="showCodeInput(true)">Code</button>
          </div>
          <div class="sync-row" id="codeRow" style="display:none">
            <input class="code-input" id="codeInput" type="password" autocomplete="current-password" placeholder="Code d'accès">
            <button class="btn small primary" onclick="saveCode()">OK</button>
          </div>
        </div>
      </details>

      <details class="panel" id="panelDrone">
        <summary>
          <span class="panel-title">Bourdon</span>
          <span class="panel-extra" id="droneCurrent"></span>
          <span class="toggle drone" id="droneToggle" onclick="event.preventDefault(); event.stopPropagation(); toggleDrone()"></span>
        </summary>
        <div class="panel-body">
          <div class="drone-notes" id="droneNotes"></div>
          <div class="drone-opts">
            <div class="toggle-wrap">
              <span class="label">Oct</span>
              <button class="btn small icon" id="octDown" onclick="shiftDroneOct(-1)">−</button>
              <span class="oct-val" id="octVal">2</span>
              <button class="btn small icon" id="octUp" onclick="shiftDroneOct(1)">+</button>
            </div>
            <div class="toggle-wrap" onclick="toggleDroneFifth()">
              <span class="label">Quinte</span><span class="toggle drone" id="fifthToggle"></span>
            </div>
            <div class="toggle-wrap">
              <span class="label">Vol</span>
              <input type="range" class="vol" id="droneVol" min="-40" max="0" step="1" oninput="setDroneVol(this.value)">
            </div>
          </div>
        </div>
      </details>

      <details class="panel" id="panelSound">
        <summary><span class="panel-title">Son</span><span class="panel-extra" id="soundSummary">Piano</span></summary>
        <div class="panel-body">
          <div class="seg" style="align-self:flex-start">
            <button class="btn small on" id="btnPiano" onclick="setTimbre('piano')">Piano</button>
            <button class="btn small" id="btnStrings" onclick="setTimbre('strings')">Cordes</button>
          </div>
          <div class="row" style="justify-content:flex-start; gap:18px">
            <div class="toggle-wrap" onclick="toggleReverb()"><span class="label">Reverb</span><span class="toggle on" id="reverbToggle"></span></div>
            <div class="toggle-wrap" onclick="toggleSoloCut()"><span class="label">Note seule coupe l'accord</span><span class="toggle" id="soloCutToggle"></span></div>
          </div>
        </div>
      </details>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/util.js?v=6"></script>
<script src="js/keyboard.js?v=6"></script>
<script src="js/editor.js?v=6"></script>
<script src="js/audio.js?v=6"></script>
<script src="js/drone.js?v=6"></script>
<script src="js/library.js?v=6"></script>
<script src="js/sortable.js?v=6"></script>
<script src="js/sequence.js?v=6"></script>
<script src="js/pads.js?v=6"></script>
<script src="js/main.js?v=6"></script>
</body>
</html>
